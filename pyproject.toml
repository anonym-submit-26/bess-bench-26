[project]
name = "bess-bench"
version = "0.1.0"
description = "BESS-Bench: benchmark for spectral representation learning and temporal forecasting on 35 years of citizen-science stellar spectroscopy"
readme = "README.md"
license = { text = "CC-BY-4.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "datasets>=3.0.0",
    "huggingface_hub>=0.27.0,<1.0",
    "pyarrow>=14.0.0",
    "astropy>=6.0.0",
    "matplotlib>=3.8.0",
    "umap-learn>=0.5.4",
    "tqdm>=4.66.0",
    "chronos-forecasting>=2.2.0",
    "timesfm>=1.3.0",
]

[project.optional-dependencies]
pipeline = [
    "duckdb>=1.0.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
]
wandb = [
    "wandb>=0.16.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
